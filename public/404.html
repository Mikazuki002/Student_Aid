<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Student Aid Support Group LLC</title>
    <!--
      SPA fallback for GitHub Pages.
      GitHub Pages returns 404.html for any unknown path; we redirect to the
      site root with the original path in a `?p=` query param so the React
      router can pick it up. The bootstrap script in index.html does the
      actual rewrite so the user ends up on the right URL.
    -->
    <script>
      ;(function () {
        try {
          var l = window.location
          if (l.search.indexOf('?p=') === -1 && l.pathname !== '/') {
            var segment = l.pathname.replace(/^\/+/, '')
            var search = l.search || ''
            var hash = l.hash || ''
            l.replace(
              l.protocol +
                '//' +
                l.host +
                '/Student_Aid/' +
                '?p=' +
                encodeURIComponent(segment) +
                '&q=' +
                encodeURIComponent(search.replace(/^\?/, '')) +
                '&h=' +
                encodeURIComponent(hash.replace(/^#/, ''))
            )
          }
        } catch (e) {
          /* swallow */
        }
      })()
    </script>
  </head>
  <body>
    <!-- Empty body; the script above redirects before anything renders. -->
  </body>
</html>
